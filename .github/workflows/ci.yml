name: CI

on:
    workflow_call:

permissions:
    contents: write

jobs:
    automerge:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - run: gh pr merge ${{ github.event.pull_request.html_url }} --auto --merge
              env:
                  GH_TOKEN: ${{ github.token }}

    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
            - uses: Karasu-Lab/JsWorkflows@main
              with:
                  task: format

    typecheck:
        needs: format
        runs-on: ubuntu-latest
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
            - uses: Karasu-Lab/JsWorkflows@main
              with:
                  task: typecheck

    build:
        needs: typecheck
        runs-on: ubuntu-latest
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
            - uses: Karasu-Lab/JsWorkflows@main
              with:
                  task: build
